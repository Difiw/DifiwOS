# Difiw OS 0.2.0 Core - GRUB 2 (BIOS) configuration
set default=0
set timeout=0

# Serial output is mirrored for QEMU/automation; input stays on the keyboard so
# a floating serial line (VirtualBox without COM1) cannot interrupt the timeout.
serial --unit=0 --speed=115200
terminal_input console
terminal_output console serial

menuentry "Difiw OS 0.2.0 Core" {
    linux /boot/bzImage console=tty0 console=ttyS0,115200 loglevel=5
    initrd /boot/rootfs.cpio.gz
}
