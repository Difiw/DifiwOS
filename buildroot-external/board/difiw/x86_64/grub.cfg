# Difiw OS 0.5.5 Core - GRUB 2 (BIOS) configuration
set default=0
set timeout=0

# Serial output is mirrored for QEMU/automation; input stays on the keyboard so
# a floating serial line (VirtualBox without COM1) cannot interrupt the timeout.
serial --unit=0 --speed=115200
terminal_input console
terminal_output console serial

# vga=792 (0x318) asks the kernel's real-mode setup for VESA 1024x768x24: it gives the
# framebuffer console and the /dev/fb0 used by the `screen` graphical shell.
menuentry "Difiw OS 0.5.5 Core" {
    linux /boot/bzImage console=tty0 console=ttyS0,115200 loglevel=5 vga=792
    initrd /boot/rootfs.cpio.gz
}
