<!doctype html><html lang="ru"><meta charset="utf-8"><title>Новая вкладка</title>
<style>
html,body{margin:0;height:100%;font-family:"DejaVu Sans",system-ui,sans-serif;color:#e8eeff;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#2a3f9a 0%,#101a45 45%,#070b22 100%)}
.hero{position:absolute;left:0;right:0;top:12%;text-align:center}
.logo{display:inline-flex;align-items:center;gap:18px}
.logo img{width:96px;height:96px}.logo b{font-size:64px;letter-spacing:1px}
.tag{margin-top:6px;opacity:.75;font-size:15px}
form{margin:34px auto 0;width:min(620px,86vw)}
input{width:100%;box-sizing:border-box;padding:15px 22px;border-radius:30px;border:1px solid #3d63d8;background:rgba(14,24,70,.8);color:#fff;font-size:16px;outline:none}
input:focus{border-color:#6a95ff;box-shadow:0 0 0 3px rgba(80,130,255,.35)}
.tiles{display:flex;justify-content:center;gap:14px;margin-top:38px;flex-wrap:wrap}
.tiles a{width:96px;padding:16px 0 12px;border-radius:14px;background:rgba(20,34,90,.72);border:1px solid rgba(90,130,255,.35);color:#e8eeff;text-decoration:none;text-align:center;font-size:13px}
.tiles a:hover{background:rgba(40,70,160,.85)}
.tiles i{display:block;width:44px;height:44px;line-height:44px;margin:0 auto 8px;border-radius:12px;font-style:normal;font-weight:700;font-size:22px;color:#fff}
</style>
<div class="hero">
 <div class="logo"><img src="netline.png" alt=""><b>Netline</b></div>
 <div class="tag">Больше, чем просто браузер</div>
 <form id="f"><input id="q" autofocus autocomplete="off" placeholder="Введите запрос или адрес"></form>
 <div class="tiles">
  <a href="https://www.youtube.com/"><i style="background:#e62117">▶</i>YouTube</a>
  <a href="https://vk.com/"><i style="background:#0077ff">VK</i>VK</a>
  <a href="https://yandex.ru/"><i style="background:#fc3f1d">Я</i>Яндекс</a>
  <a href="https://github.com/"><i style="background:#24292f">G</i>GitHub</a>
  <a href="https://ru.wikipedia.org/"><i style="background:#555">W</i>Википедия</a>
  <a href="https://www.google.com/"><i style="background:#4285f4">G</i>Google</a>
 </div>
</div>
<script>
document.getElementById('f').onsubmit=function(e){e.preventDefault();var q=document.getElementById('q').value.trim();if(!q)return;
var u=/^[a-z][a-z0-9+.-]*:\/\//i.test(q)?q:(/^[^\s\/]+\.[^\s\/.]{2,}(\/\S*)?$/.test(q)?'https://'+q:'https://yandex.ru/search/?text='+encodeURIComponent(q));
location.href=u;};
</script></html>
